plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

group = 'com.afterself'
version = mod_version

base {
    archivesName = "afterself-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups('software.bernie') }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
}

sourceSets.main.java.srcDir '../../shared/java'
sourceSets.main.java.srcDir '../src/java'
sourceSets.main.resources.srcDir '../../shared/resources'
sourceSets.main.resources.srcDir '../src/resources'

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    reobf = false

    runs {
        client {
            workingDirectory file('runs/client')
            taskName 'Client'
            // The final-jar test loads the mod from the mods folder instead.
            if (!project.hasProperty('afterselfFinalJar')) {
                mods { afterself { source sourceSets.main } }
            }
        }
        server {
            workingDirectory file('runs/server')
            taskName 'Server'
            mods { afterself { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${geckolib_mc}:${geckolib_version}")
    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Final-jar test: only the game, the released jar comes from the mods folder.
if (project.hasProperty('afterselfFinalJar')) {
    sourceSets.main.java.setSrcDirs([])
    sourceSets.main.resources.setSrcDirs([])
}

// Dev-only test client: never part of a release build.
if (project.hasProperty('afterselfTest')) {
    sourceSets.main.java.srcDir '../../testharness/shared'
    sourceSets.main.java.srcDir '../../testharness/forge-121'
}

// The version in the mod list is the one in gradle.properties.
processResources {
    inputs.property 'version', mod_version
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand version: mod_version
    }
}
